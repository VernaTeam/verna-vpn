# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G. That is a bad fit
# for this machine: 16GB RAM and a commit limit of only 16.9GB (the page file
# cannot grow, the disk is nearly full). Gradle alone would reserve up to 12GB
# of commit, leaving nothing for the Kotlin compiler's own JVM -- which is
# exactly why it died with "Failed connecting to the daemon in 4 retries".
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Compile Kotlin inside the Gradle daemon instead of spawning a second JVM.
# Slightly slower on big projects, but this one is tiny and it removes the
# whole class of daemon-startup failures on a memory-constrained machine.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
