name: verna_vpn
description: Verna VPN - Free VPN Configs
publish_to: 'none'
# Build 3002, and the reason is worth reading before touching it.
#
# `--split-per-abi` rewrites versionCode as abi * 1000 + build, so this number
# produces armeabi 4002, arm64 5002 and x86_64 7002 -- each one above the
# beta's 1001 / 2001 / 4001, which is what lets every beta install upgrade in
# place. Android only ever upgrades to a HIGHER code.
#
# Building each ABI *without* the flag (so they would all share one code) was
# tried and rejected: the tunnel core arrives as an AAR carrying all three
# ABIs, `--target-platform` does not filter those, and each file came out at
# 80 MB instead of 32. On the connections this app is for, that matters more
# than a tidy versionCode.
#
# The universal APK is built with `--build-number=7003` so it sits above every
# split and installs over anything. The version name stays 1.0.0.
version: 1.0.0+3002

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  intl: 0.20.2
  url_launcher: ^6.2.6
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  # Tunnel core: Xray 25.3.6 via a prebuilt AAR. MIT plugin, MPL-2.0 core.
  # Chosen over sing-box because it parses share URIs natively (our data shape)
  # and avoids GPL-3.0 obligations on the distributed APK.
  flutter_singbox_client: ^1.1.0
  # StreamQueue, for reading a SOCKS5 handshake off a raw socket step by step.
  async: ^2.11.0
  # sha256 for the credential hash in measurement reports (already in the
  # lock as a transitive dependency; declared because the app uses it now).
  crypto: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  # Sampled from the artwork itself rather than eyeballed, so the launcher's
  # crop -- circle, squircle, whatever -- meets the same navy the shield was
  # drawn on and the cut never shows.
  adaptive_icon_background: "#1F2D3A"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/seed_configs.json
    # Country outlines for the map on the connect screen: Natural Earth 110m
    # (public domain) quantised to int16 degrees, 45 KB. Bundled rather than
    # fetched -- the map has to draw on a network that blocks half the
    # internet, and a world that arrives late is worse than one that is
    # simply there.
    - assets/geo/world_110m.bin

  # Bundled, not fetched at runtime. This app runs on connections that block or
  # throttle Google, and a font that arrives late -- or never -- would leave
  # the interface reflowing mid-session or falling back to a face that cannot
  # set Persian well.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    # Reserved for values read as data rather than language -- timers,
    # addresses, throughput -- where a fixed advance stops digits dancing as
    # they change.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
